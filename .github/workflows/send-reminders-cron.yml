name: Send 24h event reminders

# Sends reminder emails to confirmed participants once their event is within
# 24 hours. Runs every 15 minutes so the send time tracks the real 24h-before
# mark (± up to 15 min) instead of a fixed daily time.
# Reuses the existing CRON_SECRET GitHub Actions secret.

on:
  schedule:
    - cron: '*/15 * * * *'    # every 15 minutes
  workflow_dispatch:           # allow manual runs from the Actions tab

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminders
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -X POST "https://ofarim.pages.dev/api/internal/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"; cat /tmp/out.json
          test "$code" = "200"
